<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookAI</title>
  <style>
    /* ── Reset & variables ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0e0e14;
      --surface:  #16161f;
      --card:     #1e1e2a;
      --border:   #2a2a3a;
      --accent:   #7c6cff;
      --accent2:  #ff9f43;
      --text:     #e4e4f0;
      --muted:    #888899;
      --green:    #43d98c;
      --radius:   12px;
      --shadow:   0 4px 24px rgba(0,0,0,.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 1.3rem; font-weight: 700; letter-spacing: -.5px; }
    .logo span { color: var(--accent); }

    .status-pill {
      font-size: .75rem;
      padding: .3rem .8rem;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* ── Layout ────────────────────────────────────────────────────── */
    .app {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* ── Tabs ──────────────────────────────────────────────────────── */
    .tabs {
      display: flex;
      gap: .5rem;
      margin-bottom: 2rem;
      background: var(--surface);
      padding: .4rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: .6rem 1rem;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: .9rem;
      cursor: pointer;
      transition: all .2s;
      font-weight: 500;
    }
    .tab:hover { color: var(--text); background: var(--card); }
    .tab.active { background: var(--accent); color: #fff; }

    /* ── Panels ────────────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── Form elements ─────────────────────────────────────────────── */
    .form-group { margin-bottom: 1.2rem; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .4rem; }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: .75rem 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .95rem;
      transition: border-color .2s;
    }
    input:focus { outline: none; border-color: var(--accent); }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .75rem 1.5rem;
      border: none;
      border-radius: var(--radius);
      background: var(--accent);
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
    }
    .btn:hover { opacity: .9; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-full { width: 100%; justify-content: center; }

    /* ── Settings bar ──────────────────────────────────────────────── */
    .settings {
      display: flex;
      gap: 1rem;
      align-items: center;
      padding: .8rem 1rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .setting-item { display: flex; align-items: center; gap: .5rem; font-size: .85rem; color: var(--muted); }
    .setting-item input[type="range"] { accent-color: var(--accent); width: 90px; }
    .setting-item input[type="number"] { width: 60px; padding: .3rem .5rem; font-size: .85rem; }
    .setting-val { color: var(--text); font-weight: 600; min-width: 20px; }
    .toggle-label { display: flex; align-items: center; gap: .5rem; cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }

    /* ── Results ───────────────────────────────────────────────────── */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      color: var(--muted);
      font-size: .85rem;
    }

    .book-grid { display: grid; gap: 1rem; }

    .book-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      transition: border-color .2s, transform .15s;
    }
    .book-card:hover { border-color: var(--accent); transform: translateY(-2px); }

    .book-title { font-size: 1.05rem; font-weight: 700; margin-bottom: .25rem; line-height: 1.3; }
    .book-author { font-size: .85rem; color: var(--muted); margin-bottom: .5rem; }
    .book-genre {
      display: inline-block;
      font-size: .75rem;
      padding: .2rem .7rem;
      border-radius: 20px;
      background: rgba(124,108,255,.15);
      color: var(--accent);
      border: 1px solid rgba(124,108,255,.3);
      margin-bottom: .6rem;
    }
    .book-explanation {
      font-size: .85rem;
      color: #aab;
      line-height: 1.5;
      padding: .6rem .8rem;
      background: rgba(124,108,255,.08);
      border-left: 3px solid var(--accent);
      border-radius: 0 6px 6px 0;
      margin-top: .5rem;
    }

    .book-meta { display: flex; flex-direction: column; gap: .5rem; text-align: right; min-width: 90px; }
    .meta-item { font-size: .8rem; color: var(--muted); }
    .meta-value { font-size: 1rem; font-weight: 700; color: var(--text); display: block; }
    .similarity-bar {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-top: .2rem;
      overflow: hidden;
    }
    .similarity-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 2px;
    }

    /* ── States ────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

    .skeleton { animation: pulse 1.4s ease-in-out infinite; }
    .skeleton-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      height: 110px;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    .error-msg {
      padding: .8rem 1rem;
      background: rgba(255,80,80,.1);
      border: 1px solid rgba(255,80,80,.3);
      border-radius: var(--radius);
      color: #ff8080;
      font-size: .9rem;
      margin-bottom: 1rem;
    }

    /* ── Chat ──────────────────────────────────────────────────────── */
    .chat-window {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      height: 420px;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
      margin-bottom: 1rem;
      scroll-behavior: smooth;
    }

    .msg { max-width: 80%; display: flex; flex-direction: column; gap: .2rem; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; }

    .msg-bubble {
      padding: .7rem 1rem;
      border-radius: 16px;
      font-size: .9rem;
      line-height: 1.5;
    }
    .msg.user .msg-bubble { background: var(--accent); color: #fff; border-radius: 16px 16px 4px 16px; }
    .msg.assistant .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 16px 16px 16px 4px; }

    .chat-input-row { display: flex; gap: .8rem; }
    .chat-input-row input { flex: 1; }

    .typing-dot { display: inline-flex; gap: 4px; padding: .5rem; }
    .typing-dot span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--muted);
      animation: bounce .8s infinite;
    }
    .typing-dot span:nth-child(2) { animation-delay: .15s; }
    .typing-dot span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* ── Scrollbar ─────────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">📚 Book<span>AI</span></div>
  <div class="status-pill">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>

<div class="app">

  <!-- Global settings bar -->
  <div class="settings">
    <div class="setting-item">
      <span>Results:</span>
      <input type="range" id="top-k" min="3" max="20" value="10"
             oninput="document.getElementById('top-k-val').textContent=this.value">
      <span class="setting-val" id="top-k-val">10</span>
    </div>
    <div class="setting-item">
      <span>Min rating:</span>
      <input type="range" id="min-rating" min="0" max="5" step="0.1" value="4.0"
             oninput="document.getElementById('min-rating-val').textContent=parseFloat(this.value).toFixed(1)">
      <span class="setting-val" id="min-rating-val">4.0</span>
    </div>
    <label class="toggle-label setting-item" title="Requires ANTHROPIC_API_KEY">
      <input type="checkbox" id="explain-toggle"> AI explanations
    </label>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('genre', this)">🔍 By Genre</button>
    <button class="tab" onclick="switchTab('similar', this)">📖 Similar Book</button>
    <button class="tab" onclick="switchTab('personal', this)">⚙️ Personalized</button>
    <button class="tab" onclick="switchTab('chat', this)">💬 AI Chat</button>
  </div>

  <!-- ── Panel: Genre ──────────────────────────────────────────────── -->
  <div id="panel-genre" class="panel active">
    <div class="form-group">
      <label>What kind of books are you looking for?</label>
      <input type="text" id="genre-query" placeholder="e.g. Mystery thriller, Science Fiction, Self-Improvement…"
             onkeydown="if(event.key==='Enter') searchGenre()">
    </div>
    <button class="btn btn-full" onclick="searchGenre()">Get Recommendations</button>
    <div id="genre-results" style="margin-top:1.5rem"></div>
  </div>

  <!-- ── Panel: Similar ────────────────────────────────────────────── -->
  <div id="panel-similar" class="panel">
    <div class="form-group">
      <label>Book title (or part of it)</label>
      <input type="text" id="similar-query" placeholder="e.g. Atomic Habits, Harry Potter, The Midnight Library…"
             onkeydown="if(event.key==='Enter') searchSimilar()">
    </div>
    <button class="btn btn-full" onclick="searchSimilar()">Find Similar Books</button>
    <div id="similar-results" style="margin-top:1.5rem"></div>
  </div>

  <!-- ── Panel: Personalized ───────────────────────────────────────── -->
  <div id="panel-personal" class="panel">
    <div class="row">
      <div class="form-group">
        <label>Favourite genres (comma-separated)</label>
        <input type="text" id="fav-genres" placeholder="Self-Improvement, Business…">
      </div>
      <div class="form-group">
        <label>Favourite authors (comma-separated)</label>
        <input type="text" id="fav-authors" placeholder="James Clear, Malcolm Gladwell…">
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Genres to avoid</label>
        <input type="text" id="dislike-genres" placeholder="Romance, Horror…">
      </div>
      <div class="form-group">
        <label>Max price ($)</label>
        <input type="number" id="max-price" value="30" min="0" step="1">
      </div>
    </div>
    <div class="row">
      <div class="form-group">
        <label>Max pages</label>
        <input type="number" id="max-pages" value="500" min="0" step="50">
      </div>
      <div class="form-group">
        <label>Min rating (overrides global)</label>
        <input type="number" id="personal-min-rating" value="4.5" min="0" max="5" step="0.1">
      </div>
    </div>
    <button class="btn btn-full" onclick="searchPersonal()">Get Personalized Picks</button>
    <div id="personal-results" style="margin-top:1.5rem"></div>
  </div>

  <!-- ── Panel: Chat ───────────────────────────────────────────────── -->
  <div id="panel-chat" class="panel">
    <div id="llm-warning" class="error-msg" style="display:none">
      AI chat requires <code>ANTHROPIC_API_KEY</code>. Set it and restart the server.
    </div>
    <div class="chat-window" id="chat-window">
      <div class="msg assistant">
        <div class="msg-bubble">
          👋 Hi! I'm BookAI. Ask me anything about books — I can suggest reads based on your mood, favourite topics, or what you've enjoyed before.
        </div>
      </div>
    </div>
    <div class="chat-input-row">
      <input type="text" id="chat-input"
             placeholder="e.g. 'Suggest a short thriller under $15'"
             onkeydown="if(event.key==='Enter') sendChat()">
      <button class="btn" onclick="sendChat()" id="chat-btn">Send</button>
    </div>
  </div>

</div><!-- /app -->

<script>
  // ── State ─────────────────────────────────────────────────────────
  const chatHistory = [];
  let llmAvailable = false;

  // ── Helpers ───────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const topK = () => parseInt($('top-k').value);
  const minRating = () => parseFloat($('min-rating').value);
  const explain = () => $('explain-toggle').checked && llmAvailable;

  function switchTab(name, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    $('panel-' + name).classList.add('active');
  }

  // ── Status check ──────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const r = await fetch('/api/status');
      const d = await r.json();
      $('status-dot').classList.add('on');
      $('status-text').textContent = `${d.book_count} books`;
      llmAvailable = d.llm_available;
      $('explain-toggle').disabled = !llmAvailable;
      if (!llmAvailable) $('explain-toggle').title = 'Set ANTHROPIC_API_KEY to enable';
      if (!llmAvailable) $('llm-warning').style.display = 'block';
    } catch {
      $('status-text').textContent = 'Server offline';
    }
  }

  // ── Render results ────────────────────────────────────────────────
  function renderSkeleton() {
    return Array(3).fill(0).map(() =>
      `<div class="skeleton-card skeleton" style="margin-bottom:.8rem"></div>`
    ).join('');
  }

  function renderBooks(books, containerId) {
    const el = $(containerId);
    if (!books.length) {
      el.innerHTML = `<div class="empty-state"><div class="icon">📭</div>No books found. Try a different search.</div>`;
      return;
    }
    el.innerHTML = `
      <div class="results-header">
        <span>${books.length} book${books.length>1?'s':''} found</span>
        <span>sorted by relevance</span>
      </div>
      <div class="book-grid">
        ${books.map(b => bookCard(b)).join('')}
      </div>`;
  }

  function bookCard(b) {
    const rating = b.rating ? `<span class="meta-value">${b.rating.toFixed(1)}/5</span>` : '';
    const price  = b.price  ? `<span class="meta-value">$${b.price.toFixed(2)}</span>` : '';
    const pages  = b.pages  ? `<span class="meta-value">${b.pages}p</span>` : '';
    const pct    = Math.round(b.similarity * 100);
    const expl   = b.explanation
      ? `<div class="book-explanation">💡 ${b.explanation}</div>` : '';
    return `
      <div class="book-card">
        <div>
          <div class="book-title">${esc(b.title)}</div>
          <div class="book-author">by ${esc(b.author)}</div>
          <span class="book-genre">${esc(b.genre)}</span>
          ${expl}
        </div>
        <div class="book-meta">
          ${rating ? `<div class="meta-item">Rating ${rating}</div>` : ''}
          ${price  ? `<div class="meta-item">Price ${price}</div>`  : ''}
          ${pages  ? `<div class="meta-item">Length ${pages}</div>` : ''}
          <div class="meta-item">
            Match
            <span class="meta-value">${pct}%</span>
            <div class="similarity-bar"><div class="similarity-fill" style="width:${pct}%"></div></div>
          </div>
        </div>
      </div>`;
  }

  function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showError(containerId, msg) {
    $(containerId).innerHTML = `<div class="error-msg">${esc(msg)}</div>`;
  }

  // ── Genre search ──────────────────────────────────────────────────
  async function searchGenre() {
    const q = $('genre-query').value.trim();
    if (!q) return;
    $('genre-results').innerHTML = renderSkeleton();
    try {
      const r = await fetch('/api/recommend', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mode: 'genre', query: q, top_k: topK(), min_rating: minRating(), explain: explain() })
      });
      const d = await r.json();
      if (d.error) showError('genre-results', d.error);
      else renderBooks(d.books, 'genre-results');
    } catch(e) { showError('genre-results', 'Server error: ' + e.message); }
  }

  // ── Similar search ────────────────────────────────────────────────
  async function searchSimilar() {
    const q = $('similar-query').value.trim();
    if (!q) return;
    $('similar-results').innerHTML = renderSkeleton();
    try {
      const r = await fetch('/api/recommend', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mode: 'similar', book_title: q, top_k: topK(), explain: explain() })
      });
      const d = await r.json();
      if (d.error) showError('similar-results', d.error);
      else renderBooks(d.books, 'similar-results');
    } catch(e) { showError('similar-results', 'Server error: ' + e.message); }
  }

  // ── Personalized search ───────────────────────────────────────────
  async function searchPersonal() {
    const split = s => s.split(',').map(x => x.trim()).filter(Boolean);
    const prefs = {};
    const fg = $('fav-genres').value.trim();
    const fa = $('fav-authors').value.trim();
    const dg = $('dislike-genres').value.trim();
    if (fg) prefs.favorite_genres  = split(fg);
    if (fa) prefs.favorite_authors = split(fa);
    if (dg) prefs.disliked_genres  = split(dg);
    prefs.max_price   = parseFloat($('max-price').value) || 9999;
    prefs.max_length  = parseInt($('max-pages').value)   || 9999;
    prefs.min_rating  = parseFloat($('personal-min-rating').value) || 0;

    $('personal-results').innerHTML = renderSkeleton();
    try {
      const r = await fetch('/api/recommend', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ mode: 'personalized', preferences: prefs, top_k: topK(), explain: explain() })
      });
      const d = await r.json();
      if (d.error) showError('personal-results', d.error);
      else renderBooks(d.books, 'personal-results');
    } catch(e) { showError('personal-results', 'Server error: ' + e.message); }
  }

  // ── Chat ──────────────────────────────────────────────────────────
  function appendMsg(role, text) {
    const win = $('chat-window');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = `<div class="msg-bubble">${esc(text)}</div>`;
    win.appendChild(div);
    win.scrollTop = win.scrollHeight;
    return div;
  }

  function appendTyping() {
    const win = $('chat-window');
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="msg-bubble"><div class="typing-dot"><span></span><span></span><span></span></div></div>`;
    win.appendChild(div);
    win.scrollTop = win.scrollHeight;
    return div;
  }

  async function sendChat() {
    const input = $('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    $('chat-btn').disabled = true;

    appendMsg('user', msg);
    chatHistory.push({ role: 'user', content: msg });
    const typing = appendTyping();

    try {
      const r = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ message: msg, history: chatHistory, min_rating: minRating() })
      });
      const d = await r.json();
      typing.remove();
      if (d.error) {
        appendMsg('assistant', '⚠️ ' + d.error);
      } else {
        appendMsg('assistant', d.reply);
        chatHistory.push({ role: 'assistant', content: d.reply });
      }
    } catch(e) {
      typing.remove();
      appendMsg('assistant', '⚠️ Could not reach server.');
    }
    $('chat-btn').disabled = false;
    input.focus();
  }

  // ── Init ──────────────────────────────────────────────────────────
  checkStatus();
</script>
</body>
</html>
